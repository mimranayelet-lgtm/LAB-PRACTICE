<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

table{width:100%;border-collapse:collapse}

input[type=number]{width:110px;padding:7px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:15px Heebo}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.warn{color:var(--bad);font-weight:500}
ol{margin:0 0 12px;padding-inline-start:22px}li{margin:4px 0}

/* ---------- שאלות ---------- */
const general=[
{q:"נבדקת השפעת הטמפרטורה על קצב תגובה אנזימטית. מהו המשתנה הבלתי תלוי?",o:["הטמפרטורה","קצב התגובה","סוג האנזים","נפח המבחנה"],w:"המשתנה הבלתי תלוי הוא הגורם ששוני אותו אנחנו קובעים ומשנים בכוונה."},
{q:"קצב התגובה נמדד בטיטרציה. מה המשתנה התלוי ומהי דרך המדידה?",o:["תלוי: קצב התגובה. דרך מדידה: נפח הטיטרנט שנצרך","תלוי: נפח הטיטרנט. דרך מדידה: קצב התגובה","שני המושגים זהים","תלוי: הטמפרטורה. דרך מדידה: מדחום"],w:"המשתנה התלוי הוא התופעה הנבדקת; דרך המדידה היא הכלי או השיטה שבעזרתם מכמתים אותה."},
{q:"מהי מטרת הבקרה בניסוי?",o:["לוודא שהשינוי נובע מהמשתנה הבלתי תלוי ולא מגורם אחר","להגדיל את מספר החזרות","לשנות כמה משתנים בו־זמנית","לקצר את זמן הניסוי"],w:"הבקרה מאפשרת לשלול הסברים אחרים לתוצאות."},

{q:"להכין 50 מ״ל תמיסה בריכוז 0.2M מתמיסת מלאי של 1M. כמה מ״ל ממלאי נדרשים?",n:10,w:"C₁V₁ = C₂V₂, לכן V₁ = 0.2×50 / 1 = 10 מ״ל. משלימים במים ל־50 מ״ל."},

 {q:"האינדיקטור ברומותימול כחול הפך מכחול לצהוב. מה המשמעות?",o:["נוצר CO₂ והסביבה הפכה חומצית","הסביבה הפכה בסיסית","האינדיקטור התקלקל","נכנס חמצן"],w:"CO₂ מומס יוצר חומצה, ולכן האינדיקטור צהוב. ה־NaOH מנטרל אותה."}]},
{id:"L23",t:"2023 · אנזים אוראז",c:"#c2842a",
